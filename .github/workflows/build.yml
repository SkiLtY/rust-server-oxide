name: Build Rust+Oxide Image

on:
  schedule:
    # Nightly at 03:00 UTC — before servers check for updates at 03:00
    - cron: '0 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Pinned: ubuntu-latest moved to 26.04 on 2026-10-20, where steamcmd (a
    # 32-bit binary) can no longer open sockets (CreateBoundSocket error 38,
    # "FAILED (No Connection)"). Every build from 2026-10-20 failed. 24.04 was
    # the last runner image that worked.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Oxide release URL
        id: oxide
        run: |
          OXIDE_URL=$(curl -s https://api.github.com/repos/OxideMod/Oxide.Rust/releases/latest \
            | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)['assets']
          urls = [a['browser_download_url'] for a in assets if 'linux' in a['name'].lower()]
          print(urls[0] if urls else '')
          ")
          echo "url=$OXIDE_URL" >> "$GITHUB_OUTPUT"
          echo "Oxide URL: $OXIDE_URL"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OXIDE_ZIP_FILE_URL=${{ steps.oxide.outputs.url }}
